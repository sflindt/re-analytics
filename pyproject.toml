[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "re-analytics"
version = "0.1.0"
description = "Real estate investment property finder"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "httpx>=0.25",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "scrapfly-sdk>=0.8",
    "playwright>=1.40",
    "pyzill>=1.0",
    "geopy>=2.0",
    "streamlit>=1.30",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
re-analytics = "re_analytics.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
